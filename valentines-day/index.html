<body >

<div class="container">

  <h1>
    Ummm wait a minute... 🤨<br>

  </h1>
<!-- Image with Music Control -->
<div class="image-wrapper">

  <img src="../images/intro.jpg" class="page-image">

  <!-- Audio -->
  <audio id="bg-music" autoplay loop>
    <source src="music/friends.mp3" type="audio/mpeg">
  </audio>

  <!-- Play / Pause Button -->
  <button id="music-toggle" onclick="toggleMusic()">
    ⏸
  </button>

</div>





  <p class="quote">
    "So no one told you life was gonna be this way..." 🎶
  </p>

  <div class="buttons">
    <a href="yes.html" class="btn">Yes 😅</a>
    <a href="no.html" class="btn">No 😌</a>
  </div>

</div>

<script>
  const music = document.getElementById("bg-music");
  const btn = document.getElementById("music-toggle");

  // Try autoplay on load
  window.addEventListener("load", () => {
    music.play().then(() => {
      btn.textContent = "⏸";
    }).catch(() => {
      btn.textContent = "▶";
    });
  });

  function toggleMusic() {

    if (music.paused) {
      music.play();
      btn.textContent = "⏸";
    } else {
      music.pause();
      btn.textContent = "▶";
    }

  }
</script>



</body>
