<!DOCTYPE html>
<html>
<head>
  <title>My Monica 💖</title>
  <link rel="stylesheet" href="../style.css">

    body {
      background-image: url('../images/bg-final.avif');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      margin: 0;
      height: 100vh;
    }
  </style> -->
</head>
<body>

<div class="container">

  <h1>
    So… 🥺💛<br>
    In true FRIENDS style…
  </h1>

  <p class="big-text">

    Will you be my Monica? 💍💖  
    And let me be your Chandler…  
    Forever? 🥰

  </p>
  <!-- Image with Music Control -->
<div class="image-wrapper">

  <img src="../images/final.jpg" class="page-image">

  <!-- Audio -->
  <audio id="bg-music" autoplay loop>
    <source src="music/final.mp3" type="audio/mpeg">
  </audio>

  <!-- Play / Pause Button -->
  <button id="music-toggle" onclick="toggleMusic()">
    ⏸
  </button>

</div>
    

  <div class="buttons">

    <button class="btn" onclick="yesAnswer()">
      Yes 💕
    </button>

    <button class="btn" onclick="noAnswer()">
      No 🙈
    </button>

  </div>

</div>

<script>
  const music = document.getElementById("bg-music");
  const btn = document.getElementById("music-toggle");
function yesAnswer() {
  window.location.href = "forever.html";
}


function noAnswer() {
  alert("Nope 😏\nThis button is just for decoration 😂❤️");
}

  // Try autoplay on load
  window.addEventListener("load", () => {
    music.play().then(() => {
      btn.textContent = "⏸";
    }).catch(() => {
      btn.textContent = "▶";
    });
  });

  function toggleMusic() {

    if (music.paused) {
      music.play();
      btn.textContent = "⏸";
    } else {
      music.pause();
      btn.textContent = "▶";
    }

  }
</script>

</body>
</html>
