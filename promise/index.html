<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promise Day 🤝</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="container">

  <h1>Happy Promise Day 🤝💖</h1>

  <p class="big-text">
    I promise… 🥺💛 
    To always stand by you ❤️  
    To support you no matter the situation 💪  
    To annoy you our entire life😜  
    To love you forever till this heart stops beating and the lungs can't breathe anymore💍💕
  </p>
<!-- Image with Music Control -->
<div class="image-wrapper">

  <img src="../images/promise.jpg" class="page-image">

  <!-- Audio -->
  <audio id="bg-music" autoplay loop>
    <source src="/music/promise.mp3" type="audio/mpeg">
  </audio>

  <!-- Play / Pause Button -->
  <button id="music-toggle" onclick="toggleMusic()">
    ⏸
  </button>

</div>

  <p class="quote">
    “I’ll be there for you… Always.” 💛
  </p>

  <a href="../index.html" class="btn">⬅ Back</a>

</div>

<script>

// const img = document.getElementById("promiseImg");
// const audio = document.getElementById("promiseAudio");
// const tap = document.getElementById("tapText");

// /* Play audio on image click */

//     // Hide popup after play
//     tap.style.display = "none";

//   }).catch(()=>{
//     console.log("Audio blocked");
//   });

// });
const music = document.getElementById("bg-music");
  const btn = document.getElementById("music-toggle");

  // Try autoplay on load
  window.addEventListener("load", () => {
    music.play().then(() => {
      btn.textContent = "⏸";
    }).catch(() => {
      btn.textContent = "▶";
    });
  });

  function toggleMusic() {

    if (music.paused) {
      music.play();
      btn.textContent = "⏸";
    } else {
      music.pause();
      btn.textContent = "▶";
    }

  }
</script>

</body>
</html>
